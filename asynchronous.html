//java script is a synchronous but behave like asynchronous

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    setTimeout(() => {
   console.log("A");
}, 0);

setTimeout(() => {
   console.log("C");
}, 1000);

setTimeout(() => {
   console.log("D");
}, 2000);

console.log("B");
</script>
</body>
</html>
